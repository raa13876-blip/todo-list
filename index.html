<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мои задачи — To-Do List</title>
  <meta name="description" content="Простой список задач: добавление, отметка, удаление, сохранение в браузере." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // применяем тему до отрисовки, чтобы не было вспышки светлого фона
    (function () {
      var t = null;
      try { t = localStorage.getItem("todo-list.theme"); } catch (_) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Категории">
      <div class="brand">
        <span class="brand__logo" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 7.3l2.6 2.6L11 4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </span>
        <span class="brand__name">To-Do List</span>
      </div>
      <p class="sidebar__title">Категории</p>
      <nav class="categories" id="categories">
        <button class="category is-active" data-category="all">Все задачи <span class="category__count" data-cat-count="all">0</span></button>
        <button class="category" data-category="today">Сегодня <span class="category__count" data-cat-count="today">0</span></button>
        <button class="category" data-category="work">Работа <span class="category__count" data-cat-count="work">0</span></button>
        <button class="category" data-category="personal">Личное <span class="category__count" data-cat-count="personal">0</span></button>
      </nav>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header__top">
          <p class="header__date" id="today-date"></p>
          <div class="header__controls">
            <button class="theme-toggle" id="theme-toggle" type="button">
              <span class="star-border" aria-hidden="true"><span class="star-border__line"></span></span>
              <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /></svg>
              <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></g></svg>
              <span class="theme-toggle__label" id="theme-label">Тёмная тема</span>
            </button>
          </div>
        </div>
        <h1 class="header__title">Мои задачи</h1>
        <p class="header__subtitle">Всё важное — в одном месте. Начните с небольшой задачи.</p>
      </header>

      <form class="add" id="add-form" autocomplete="off">
        <label class="add__field">
          <svg class="add__icon" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <input class="add__input" id="add-input" type="text" maxlength="200"
                 placeholder="Что нужно сделать?" aria-label="Новая задача" />
          <select class="add__select" id="add-category" aria-label="Категория задачи">
            <option value="">Без категории</option>
            <option value="today">Сегодня</option>
            <option value="work">Работа</option>
            <option value="personal">Личное</option>
          </select>
        </label>
        <button class="btn-primary" type="submit">Добавить</button>
      </form>

      <section class="card" aria-label="Список задач">
        <div class="filters" role="tablist">
          <button class="filter is-active" data-filter="all" role="tab">Все <span class="filter__count" data-count="all">0</span></button>
          <button class="filter" data-filter="active" role="tab">Активные <span class="filter__count" data-count="active">0</span></button>
          <button class="filter" data-filter="done" role="tab">Выполненные <span class="filter__count" data-count="done">0</span></button>
        </div>

        <ul class="tasks" id="task-list"></ul>
        <p class="empty" id="empty" hidden>Здесь пока пусто.</p>

        <footer class="summary">
          <p class="summary__left"><b id="left-count">0</b> <span id="left-label">задач осталось</span></p>
          <button class="link-btn" id="clear-done">Очистить выполненные</button>
        </footer>
      </section>

      <p class="hint">Маленькие шаги складываются в большие результаты.</p>
    </main>

    <aside class="progress" aria-label="Прогресс дня">
      <p class="progress__title">Прогресс дня</p>
      <div class="progress__ring" id="progress-ring" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Выполнено задач">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="progress__track" cx="60" cy="60" r="52" />
          <circle class="progress__value" id="progress-value" cx="60" cy="60" r="52" pathLength="100" />
        </svg>
        <span class="progress__percent" id="progress-percent">0%</span>
      </div>
      <dl class="progress__stats">
        <div><dt>Всего</dt><dd id="stat-total">0</dd></div>
        <div><dt>Активные</dt><dd id="stat-active">0</dd></div>
        <div><dt>Выполнено</dt><dd id="stat-done">0</dd></div>
      </dl>
    </aside>
  </div>

  <template id="task-template">
    <li class="task">
      <label class="check">
        <input type="checkbox" class="check__input" />
        <span class="check__box" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 7.3l2.6 2.6L11 4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </span>
      </label>
      <span class="task__title"></span>
      <span class="task__tag"></span>
      <button class="task__delete" type="button" aria-label="Удалить задачу">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
      </button>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
